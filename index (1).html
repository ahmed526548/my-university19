                className="w-full bg-transparent text-gray-300 text-sm focus:outline-none resize-none" />
              <div className="flex gap-2 mt-3">
                <button onClick={saveNote} className="flex-1 bg-red-600 hover:bg-red-500 text-white py-2 rounded-xl text-sm font-bold flex items-center justify-center gap-1.5">
                  <Icons.Check className="w-4 h-4" /> {editingNote ? 'تحديث' : 'حفظ'}
                </button>
                {editingNote && (
                  <button onClick={() => { setEditingNote(null); setNoteTitle(''); setNoteText(''); }} className="px-4 border border-gray-700 text-gray-400 rounded-xl text-sm">إلغاء</button>
                )}
              </div>
            </div>
            {notes.length === 0 ? (
              <div className="text-center py-12 text-gray-600">
                <Icons.Note className="w-12 h-12 mx-auto mb-3 opacity-40" />
                <p className="text-sm">لا توجد ملاحظات بعد</p>
              </div>
            ) : (
              <div className="space-y-3">
                {notes.slice().reverse().map(n => (
                  <div key={n.id} className="glass border border-red-900/30 rounded-xl p-4">
                    <div className="flex justify-between items-start mb-2">
                      <h4 className="font-bold text-white text-sm">{n.title}</h4>
                      <div className="flex gap-1">
                        <button onClick={() => { setEditingNote(n.id); setNoteTitle(n.title); setNoteText(n.text); }} className="p-1.5 text-gray-500 hover:text-blue-400"><Icons.Edit className="w-4 h-4" /></button>
                        <button onClick={() => deleteNote(n.id)} className="p-1.5 text-gray-500 hover:text-red-400"><Icons.Trash className="w-4 h-4" /></button>
                      </div>
                    </div>
                    <p className="text-gray-400 text-xs whitespace-pre-wrap leading-relaxed">{n.text}</p>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      );

      const TimerView = () => (
        <div className="min-h-screen bg-[#050000] flex flex-col items-center justify-center p-6">
          <button onClick={() => setView('home')} className="absolute top-5 right-5 flex items-center text-red-400 font-semibold text-sm">
            <Icons.ChevronRight className="w-5 h-5" /> العودة
          </button>
          <div className="text-center mb-8">
            <Icons.Timer className="w-10 h-10 text-red-400 mx-auto mb-3" />
            <h2 className="text-xl font-bold text-white">مؤقت بومودورو</h2>
            <p className="text-gray-500 text-xs mt-1">{timerMode === 'focus' ? 'وقت التركيز' : 'وقت الاستراحة'}</p>
          </div>
          <div className="relative w-56 h-56 mb-8">
            <svg className="w-full h-full -rotate-90" viewBox="0 0 100 100">
              <circle cx="50" cy="50" r="45" fill="none" stroke="#1a0505" strokeWidth="6" />
              <circle cx="50" cy="50" r="45" fill="none" stroke={timerMode === 'focus' ? '#ef4444' : '#22c55e'} strokeWidth="6"
                strokeLinecap="round" strokeDasharray={`${2 * Math.PI * 45}`}
                strokeDashoffset={`${2 * Math.PI * 45 * (1 - timerSeconds / (timerMode === 'focus' ? 25 * 60 : 5 * 60))}`}
                className="progress-ring" />
            </svg>
            <div className="absolute inset-0 flex items-center justify-center">
              <span className="text-4xl font-bold text-white tabular-nums" dir="ltr">{formatTimer(timerSeconds)}</span>
            </div>
          </div>
          <div className="flex gap-3">
            <button onClick={() => setTimerRunning(!timerRunning)}
              className={`px-8 py-3 rounded-xl font-bold text-sm ${timerRunning ? 'bg-amber-600 text-white' : 'bg-red-600 text-white'}`}>
              {timerRunning ? 'إيقاف' : 'ابدأ'}
            </button>
            <button onClick={() => { setTimerRunning(false); setTimerSeconds(timerMode === 'focus' ? 25 * 60 : 5 * 60); }}
              className="px-5 py-3 rounded-xl border border-red-900/50 text-red-400 text-sm font-bold">
              إعادة
            </button>
          </div>
          <div className="flex gap-2 mt-6">
            <button onClick={() => { setTimerMode('focus'); setTimerSeconds(25 * 60); setTimerRunning(false); }}
              className={`px-4 py-1.5 rounded-full text-xs ${timerMode === 'focus' ? 'bg-red-600 text-white' : 'bg-red-950/40 text-gray-400'}`}>تركيز 25</button>
            <button onClick={() => { setTimerMode('break'); setTimerSeconds(5 * 60); setTimerRunning(false); }}
              className={`px-4 py-1.5 rounded-full text-xs ${timerMode === 'break' ? 'bg-green-600 text-white' : 'bg-red-950/40 text-gray-400'}`}>استراحة 5</button>
          </div>
        </div>
      );

      const GPAView = () => (
        <div className="min-h-screen bg-[#050000] pb-8">
          <NavBar title="حاسبة المعدل" onBack={() => setView('home')} />
          <div className="px-4 pt-3">
            <div className="glass border border-red-900/40 rounded-2xl p-5 mb-5 text-center">
              <p className="text-gray-500 text-xs mb-1">المعدل التراكمي المتوقع</p>
              <p className="text-4xl font-extrabold text-red-400">{calcGPA()}</p>
              <p className="text-[10px] text-gray-600 mt-1">من 4.0</p>
            </div>
            <div className="space-y-3 mb-4">
              {gpaCourses.map((c, i) => (
                <div key={i} className="glass border border-red-900/30 rounded-xl p-3 flex gap-2 items-center">
                  <input value={c.name} onChange={e => { const n = [...gpaCourses]; n[i].name = e.target.value; setGpaCourses(n); }}
                    placeholder="المادة" className="flex-1 bg-transparent text-sm text-white focus:outline-none min-w-0" />
                  <select value={c.grade} onChange={e => { const n = [...gpaCourses]; n[i].grade = e.target.value; setGpaCourses(n); }}
                    className="bg-[#1a0505] border border-red-900/40 text-white text-xs rounded-lg px-2 py-1.5">
                    <option value="">درجة</option>
                    {['A+', 'A', 'B+', 'B', 'C+', 'C', 'D', 'F'].map(g => <option key={g} value={g}>{g}</option>)}
                  </select>
                  <input type="number" value={c.hours} onChange={e => { const n = [...gpaCourses]; n[i].hours = e.target.value; setGpaCourses(n); }}
                    placeholder="ساعات" className="w-16 bg-transparent text-sm text-white text-center focus:outline-none border border-red-900/30 rounded-lg py-1" />
                  {gpaCourses.length > 1 && (
                    <button onClick={() => setGpaCourses(gpaCourses.filter((_, j) => j !== i))} className="text-gray-600 hover:text-red-400"><Icons.X className="w-4 h-4" /></button>
                  )}
                </div>
              ))}
            </div>
            <button onClick={() => setGpaCourses([...gpaCourses, { name: '', grade: '', hours: '' }])}
              className="w-full border border-dashed border-red-900/50 text-red-400 py-2.5 rounded-xl text-sm font-semibold flex items-center justify-center gap-1.5">
              <Icons.Plus className="w-4 h-4" /> إضافة مادة
            </button>
          </div>
        </div>
      );

      const AnnouncementsView = () => (
        <div className="min-h-screen bg-[#050000] pb-8">
          <NavBar title="الإعلانات" onBack={() => setView('home')} />
          <div className="px-4 pt-3 space-y-3">
            {announcements.map(a => (
              <div key={a.id} className={`glass border rounded-2xl p-4 ${
                a.type === 'warning' ? 'border-amber-800/40' : a.type === 'success' ? 'border-green-800/40' : a.type === 'tip' ? 'border-blue-800/40' : 'border-red-900/30'
              }`}>
                <div className="flex items-start gap-3">
                  <div className={`w-9 h-9 rounded-xl flex items-center justify-center shrink-0 ${
                    a.type === 'warning' ? 'bg-amber-950 text-amber-400' : a.type === 'success' ? 'bg-green-950 text-green-400' : a.type === 'tip' ? 'bg-blue-950 text-blue-400' : 'bg-red-950 text-red-400'
                  }`}>
                    <Icons.Bell className="w-4 h-4" />
                  </div>
                  <div>
                    <h4 className="font-bold text-white text-sm">{a.title}</h4>
                    <p className="text-gray-400 text-xs mt-1 leading-relaxed">{a.body}</p>
                    <p className="text-[10px] text-gray-600 mt-2" dir="ltr">{a.date}</p>
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>
      );

      const SettingsView = () => (
        <div className="min-h-screen bg-[#050000] pb-8">
          <NavBar title="الإعدادات" onBack={() => setView('home')} />
          <div className="px-4 pt-3 space-y-3">
            <div className="glass border border-red-900/30 rounded-2xl p-4">
              <h3 className="font-bold text-white text-sm mb-3">البيانات المحفوظة</h3>
              <div className="space-y-2 text-xs text-gray-400">
                <div className="flex justify-between"><span>المفضلة</span><span className="text-red-400">{favorites.length}</span></div>
                <div className="flex justify-between"><span>محاضرات مكتملة</span><span className="text-red-400">{Object.keys(completed).length}</span></div>
                <div className="flex justify-between"><span>ملاحظات</span><span className="text-red-400">{notes.length}</span></div>
                <div className="flex justify-between"><span>الجروب</span><span className="text-red-400">{selectedGroup || '—'}</span></div>
              </div>
            </div>
            <button onClick={() => {
              if (confirm('هل أنت متأكد من مسح كل البيانات المحلية؟')) {
                localStorage.clear();
                setFavorites([]); setCompleted({}); setNotes([]); setSelectedGroup(null);
                showToast('تم مسح جميع البيانات');
              }
            }} className="w-full glass border border-red-900/40 text-red-400 py-3 rounded-xl text-sm font-bold flex items-center justify-center gap-2">
              <Icons.Trash className="w-4 h-4" /> مسح كل البيانات المحلية
            </button>
            <div className="glass border border-red-900/30 rounded-2xl p-4 text-center">
              <Icons.Graduation className="w-8 h-8 text-red-500 mx-auto mb-2" />
              <p className="text-white font-bold text-sm">بوابة جامعة بني سويف الأهلية</p>
              <p className="text-gray-500 text-xs mt-1">إصدار محسّن 2026 • للاستخدام التعليمي</p>
            </div>
          </div>
        </div>
      );

      // Global Search Overlay
      const SearchOverlay = () => showSearch && (
        <div className="fixed inset-0 z-50 bg-black/90 backdrop-blur-md animate-fade-in flex flex-col">
          <div className="p-4 flex items-center gap-3">
            <button onClick={() => { setShowSearch(false); setGlobalSearch(''); }} className="text-gray-400"><Icons.X className="w-6 h-6" /></button>
            <input autoFocus value={globalSearch} onChange={e => setGlobalSearch(e.target.value)} placeholder="ابحث في كل المحاضرات..."
              className="flex-1 bg-[#110000] border border-red-900/50 text-white rounded-xl py-3 px-4 text-sm focus:outline-none focus:border-red-500" />
          </div>
          <div className="flex-1 overflow-y-auto px-4 pb-8">
            {globalSearch && searchResults.length === 0 && <p className="text-center text-gray-600 mt-10 text-sm">لا توجد نتائج</p>}
            {searchResults.map((r, i) => (
              <button key={i} onClick={() => {
                setShowSearch(false); setGlobalSearch('');
                setSelectedSubject(r.subject); setView('lectures');
                setTimeout(() => setPreview({ open: true, title: r.lecture.title, content: r.lecture.summaryAr, lang: 'ar', lecture: r.lecture }), 200);
              }} className="w-full text-right glass border border-red-900/30 rounded-xl p-3 mb-2 hover:border-red-500/40 transition">
                <div className="text-xs text-red-400 mb-0.5">{r.subject.arabicName}</div>
                <div className="text-sm text-white font-medium">{r.lecture.title}</div>
              </button>
            ))}
          </div>
        </div>
      );

      // Bottom Nav (mobile)
      const BottomNav = () => view !== 'home' ? null : (
        <div className="fixed bottom-0 inset-x-0 z-30 glass-strong border-t border-red-900/40 safe-bottom">
          <div className="flex justify-around py-2 max-w-lg mx-auto">
            {[
              { icon: Icons.Home, label: 'الرئيسية', v: 'home' },
              { icon: Icons.BookOpen, label: 'المواد', v: 'subjects' },
              { icon: Icons.Bot, label: 'المساعد', v: 'bot' },
              { icon: Icons.Calendar, label: 'الجدول', v: selectedGroup ? 'schedule' : 'groups' },
            ].map(({ icon: I, label, v }) => (
              <button key={v} onClick={() => setView(v)} className={`flex flex-col items-center gap-0.5 px-3 py-1 ${view === v ? 'text-red-400' : 'text-gray-500'}`}>
                <I className="w-5 h-5" />
                <span className="text-[10px] font-medium">{label}</span>
              </button>
            ))}
          </div>
        </div>
      );

      return (
        <div dir="rtl" className="font-cairo min-h-screen bg-[#050000] text-gray-200">
          {view === 'home' && <Home />}
          {view === 'subjects' && <Subjects />}
          {view === 'lectures' && <Lectures />}
          {view === 'bot' && <BotView />}
          {view === 'groups' && <Groups />}
          {view === 'schedule' && <Schedule />}
          {view === 'notes' && <NotesView />}
          {view === 'timer' && <TimerView />}
          {view === 'gpa' && <GPAView />}
          {view === 'announcements' && <AnnouncementsView />}
          {view === 'settings' && <SettingsView />}
          <SearchOverlay />
          <BottomNav />

          {/* Toast */}
          {toast && (
            <div className={`fixed bottom-20 left-1/2 -translate-x-1/2 z-50 px-5 py-2.5 rounded-xl shadow-lg font-semibold text-sm flex items-center gap-2 animate-slide-up ${
              toast.type === 'error' ? 'bg-red-700 text-white' : 'bg-green-600 text-white'
            }`}>
              <Icons.CheckCircle className="w-4 h-4" /> {toast.msg || toast}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
